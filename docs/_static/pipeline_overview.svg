<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" width="100%" style="max-width:760px" role="img" aria-labelledby="cf-pipe-title">
  <title id="cf-pipe-title">GATAC pipeline: fragment files to Parquet, filtered Parquet, one tile matrix of the top tiles, clusters, peaks and a peak matrix</title>
  <style>
    .cf-text  { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-base, sans-serif); font-size: 13px; }
    .cf-muted { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-base, sans-serif); font-size: 11px; }
    .cf-code  { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-monospace, monospace); font-size: 11px; }
    .cf-bold  { font-weight: 600; }
    .cf-box   { fill: var(--pst-color-surface, #f6f8fa); stroke: var(--pst-color-border, #d0d7de); stroke-width: 1; }
    .cf-sheet { fill: var(--pst-color-background, #ffffff); stroke: var(--pst-color-border, #d0d7de); stroke-width: 1; }
    .cf-line  { stroke: var(--pst-color-text-muted, #59636e); stroke-width: 1.4; fill: none; }
    .cf-head  { fill: var(--pst-color-text-muted, #59636e); }
    .cf-id    { fill: #73b301; fill-opacity: 0.14; stroke: #73b301; stroke-width: 1.2; }
    .cf-idbg  { fill: var(--pst-color-background, #ffffff); stroke: #73b301; stroke-width: 1.2; }
    .cf-val   { fill: #4c8bf5; fill-opacity: 0.14; stroke: #4c8bf5; stroke-width: 1.2; }
    .cf-chip  { fill: var(--pst-color-background, #ffffff); stroke: #4c8bf5; stroke-width: 1; }
    .cf-read  { stroke: #73b301; stroke-width: 1.8; fill: none; }
    .cf-rhead { fill: #73b301; }
  </style>
  <defs>
    <marker id="cf-pipe-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="cf-head"/>
    </marker>
    <marker id="cf-pipe-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="cf-rhead"/>
    </marker>
  </defs>

  <!-- 1. fragments.tsv.gz, one per sample -->
  <rect x="160" y="10" width="400" height="52" rx="6" class="cf-sheet"/>
  <rect x="155" y="15" width="400" height="52" rx="6" class="cf-sheet"/>
  <rect x="150" y="20" width="400" height="52" rx="6" class="cf-box"/>
  <text x="350" y="42" text-anchor="middle" class="cf-text cf-bold">fragments.tsv.gz</text>
  <text x="350" y="60" text-anchor="middle" class="cf-muted">one per sample, names as text in every row</text>

  <line x1="350" y1="72" x2="350" y2="100" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="340" y="90" text-anchor="end" class="cf-code">gatac convert</text>

  <!-- 2. Parquet, one per sample -->
  <rect x="160" y="102" width="400" height="52" rx="6" class="cf-sheet"/>
  <rect x="155" y="107" width="400" height="52" rx="6" class="cf-sheet"/>
  <rect x="150" y="112" width="400" height="52" rx="6" class="cf-box"/>
  <text x="350" y="134" text-anchor="middle" class="cf-text cf-bold">Parquet fragments</text>
  <text x="350" y="152" text-anchor="middle" class="cf-muted">integer ids, barcode table in the file</text>

  <!-- QC tables -->
  <line x1="560" y1="138" x2="588" y2="138" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <rect x="590" y="112" width="150" height="52" rx="6" class="cf-box"/>
  <text x="665" y="134" text-anchor="middle" class="cf-text cf-bold">QC per cell</text>
  <text x="665" y="152" text-anchor="middle" class="cf-code">metrics · doublets</text>
  <path d="M665,164 V190 H356" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="665" y="205" text-anchor="middle" class="cf-muted">query on the metrics</text>

  <line x1="350" y1="164" x2="350" y2="208" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="340" y="182" text-anchor="end" class="cf-code">gatac filter</text>

  <!-- 3. Filtered Parquet, one per sample -->
  <rect x="160" y="210" width="400" height="52" rx="6" class="cf-idbg"/>
  <rect x="155" y="215" width="400" height="52" rx="6" class="cf-idbg"/>
  <rect x="150" y="220" width="400" height="52" rx="6" class="cf-idbg"/>
  <rect x="150" y="220" width="400" height="52" rx="6" class="cf-id"/>
  <text x="350" y="242" text-anchor="middle" class="cf-text cf-bold">Filtered Parquet fragments</text>
  <text x="350" y="260" text-anchor="middle" class="cf-muted">the cells that pass QC, one file per sample</text>

  <!-- reads of the filtered files: tile scan and build -->
  <line x1="216" y1="272" x2="216" y2="370" class="cf-read" marker-end="url(#cf-pipe-g)"/>
  <text x="224" y="300" class="cf-muted">pass 1</text>
  <line x1="484" y1="272" x2="484" y2="370" class="cf-read" marker-end="url(#cf-pipe-g)"/>
  <text x="476" y="300" text-anchor="end" class="cf-muted">pass 2</text>

  <!-- reads of the filtered files: bus to the peak steps -->
  <path d="M150,246 H60 V700 H148" class="cf-read" marker-end="url(#cf-pipe-g)"/>
  <path d="M60,598 H148" class="cf-read" marker-end="url(#cf-pipe-g)"/>

  <!-- reads of the filtered files: gene matrix -->
  <path d="M560,246 H665 V338" class="cf-read" marker-end="url(#cf-pipe-g)"/>

  <!-- 4. One tile matrix, top tiles -->
  <rect x="150" y="330" width="400" height="104" rx="6" class="cf-val"/>
  <text x="350" y="352" text-anchor="middle" class="cf-text cf-bold">One tile matrix, top tiles</text>
  <rect x="160" y="372" width="112" height="28" rx="4" class="cf-chip"/>
  <text x="216" y="390" text-anchor="middle" class="cf-muted">scan: tile statistics</text>
  <line x1="274" y1="386" x2="292" y2="386" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <rect x="294" y="372" width="112" height="28" rx="4" class="cf-chip"/>
  <text x="350" y="390" text-anchor="middle" class="cf-muted">select the top n</text>
  <line x1="408" y1="386" x2="426" y2="386" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <rect x="428" y="372" width="112" height="28" rx="4" class="cf-chip"/>
  <text x="484" y="390" text-anchor="middle" class="cf-muted">build: those tiles</text>
  <text x="350" y="422" text-anchor="middle" class="cf-code">gatac tile -n · cells × selected tiles</text>

  <!-- Gene matrix -->
  <rect x="590" y="340" width="150" height="76" rx="6" class="cf-val"/>
  <text x="665" y="362" text-anchor="middle" class="cf-text cf-bold">Gene matrix</text>
  <text x="665" y="382" text-anchor="middle" class="cf-code">gatac gene</text>
  <text x="665" y="400" text-anchor="middle" class="cf-muted">one matrix, all samples</text>

  <line x1="350" y1="434" x2="350" y2="478" class="cf-line" marker-end="url(#cf-pipe-a)"/>

  <!-- 5. Embedding and clusters -->
  <rect x="150" y="480" width="400" height="52" rx="6" class="cf-box"/>
  <text x="350" y="502" text-anchor="middle" class="cf-text cf-bold">Embedding and clusters</text>
  <text x="350" y="520" text-anchor="middle" class="cf-code">dr.spectral → kNN → Leiden</text>

  <line x1="350" y1="532" x2="350" y2="570" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="360" y="555" class="cf-muted">clusters in obs</text>

  <!-- 6. Peaks per cluster -->
  <rect x="150" y="572" width="400" height="52" rx="6" class="cf-box"/>
  <text x="350" y="594" text-anchor="middle" class="cf-text cf-bold">Peaks per cluster, merged</text>
  <text x="350" y="612" text-anchor="middle" class="cf-code">peak.call (MACS3) → peak.merge</text>

  <line x1="350" y1="624" x2="350" y2="672" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="360" y="652" class="cf-muted">peak set</text>

  <!-- 7. Peak matrix -->
  <rect x="150" y="674" width="400" height="52" rx="6" class="cf-val"/>
  <text x="350" y="696" text-anchor="middle" class="cf-text cf-bold">Peak matrix</text>
  <text x="350" y="714" text-anchor="middle" class="cf-code">peak.make_matrix · cells × peaks</text>

  <line x1="350" y1="726" x2="350" y2="752" class="cf-line" marker-end="url(#cf-pipe-a)"/>
  <text x="350" y="768" text-anchor="middle" class="cf-muted">markers, motif enrichment, chromVAR</text>

  <!-- legend -->
  <g transform="translate(20,790)">
    <line x1="0" y1="6" x2="28" y2="6" class="cf-read" marker-end="url(#cf-pipe-g)"/>
    <text x="36" y="10" class="cf-muted">reads the filtered Parquet files</text>
    <rect x="232" y="-1" width="18" height="14" rx="3" class="cf-val"/>
    <text x="258" y="10" class="cf-muted">AnnData</text>
    <rect x="330" y="-4" width="18" height="14" rx="3" class="cf-sheet"/>
    <rect x="326" y="0" width="18" height="14" rx="3" class="cf-box"/>
    <text x="356" y="10" class="cf-muted">one file per sample</text>
  </g>
</svg>
